name: harun-office
services:
  worker:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 660s
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/office:size=4m,mode=0700
    environment:
      OFFICE_DATA_DIR: /data
      NEUROBRO_API_KEY_FILE: /run/office/neuroapi_key
      BINANCE_API_KEY_FILE: /run/office/binance_api_key
      BINANCE_API_SECRET_FILE: /run/office/binance_api_secret
      OFFICE_DASHBOARD_ORIGIN: ${OFFICE_DASHBOARD_ORIGIN:-https://harun5231.github.io}
      OFFICE_AUTO_DRY_RUN: ${OFFICE_AUTO_DRY_RUN:-false}
      OFFICE_RUN_AT: ${OFFICE_RUN_AT:-08:00}
      OFFICE_CANDLE_LOOKBACK: ${OFFICE_CANDLE_LOOKBACK:-100}
      OFFICE_MARKET_MAX_AGE: ${OFFICE_MARKET_MAX_AGE:-180}
    secrets: [read_token, control_token, neuroapi_key, binance_api_key, binance_api_secret]
    volumes:
      - worker_data:/data
    networks: [office]
    healthcheck:
      test: [CMD, python, -m, worker.health]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      worker: {condition: service_started}
    ports: ["80:80", "443:443/udp", "443:443"]
    environment:
      OFFICE_WORKER_HOST: ${OFFICE_WORKER_HOST:?Configure worker domain}
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [office]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  office: {}
volumes:
  worker_data: {}
  caddy_data: {}
  caddy_config: {}
secrets:
  read_token:
    file: ${OFFICE_PRIVATE_DIR}/secrets/read_token
  control_token:
    file: ${OFFICE_PRIVATE_DIR}/secrets/control_token
  neuroapi_key:
    file: ${OFFICE_PRIVATE_DIR}/secrets/neuroapi_key
  binance_api_key:
    file: ${OFFICE_PRIVATE_DIR}/secrets/binance_api_key
  binance_api_secret:
    file: ${OFFICE_PRIVATE_DIR}/secrets/binance_api_secret
